name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test shuffled
        run: go test -shuffle=on -count=1 ./...

      - name: Race detector
        run: go test -race -count=1 ./...

      - name: Coverage
        # Windows PowerShell 会把 -coverprofile=coverage.out 拆成两段，
        # 必须整体加引号。
        run: go test -count=1 '-coverprofile=coverage.out' ./...

      - name: Show coverage
        run: go tool cover -func coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build-cross:
    name: build (windows/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [386, amd64, arm64]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Build
        run: go build ./...
        env:
          GOARCH: ${{ matrix.arch }}

  fuzz:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Fuzz short run (10s)
        run: go test -run '^$' -fuzz '^FuzzValidateInstallOptions$' -fuzztime=10s ./lib/service/

  govulncheck:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
